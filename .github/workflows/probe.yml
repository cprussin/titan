name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for a in com/android/tools/build/gradle androidx/compose/material3/material3 androidx/compose/compose-bom androidx/work/work-runtime-ktx androidx/lifecycle/lifecycle-viewmodel-compose; do
            echo "== $a: $(curl -s https://dl.google.com/android/maven2/$a/maven-metadata.xml | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -vE 'alpha|beta|rc' | sort -V | tail -6 | tr '\n' ' ')"
          done
          curl -s https://dl.google.com/android/maven2/com/android/tools/build/gradle/9.4.0/gradle-9.4.0.pom | grep -A3 -i "kotlin\|<version>" | head -40
          curl -s https://services.gradle.org/versions/current | head -5
