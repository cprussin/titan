name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for a in androidx/activity/activity-compose androidx/navigation/navigation-compose androidx/browser/browser androidx/core/core-ktx androidx/work/work-runtime androidx/lifecycle/lifecycle-runtime-compose androidx/compose/material3/adaptive/adaptive androidx/compose/material3/material3-window-size-class androidx/window/window androidx/datastore/datastore-preferences androidx/compose/ui/ui androidx/compose/material3/material3 androidx/core/core-splashscreen; do
            echo "== $a: $(curl -s https://dl.google.com/android/maven2/$a/maven-metadata.xml | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -viE 'alpha|beta|rc|-' | sort -V | tail -3 | tr '\n' ' ')"
          done
          curl -s https://dl.google.com/android/maven2/androidx/compose/compose-bom/2026.09.00/compose-bom-2026.09.00.pom | grep -B1 -A1 "material3<\|<artifactId>ui<" | head
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools; $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" | head -20
