name: Android
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      TITAN_VERSION_CODE: ${{ github.run_number }}
      TITAN_VERSION_NAME: "1.0.${{ github.run_number }}"
      HAS_KEYSTORE_SECRET: ${{ secrets.TITAN_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # Release signing: a keystore from repository secrets when configured
      # (TITAN_KEYSTORE_BASE64, TITAN_KEYSTORE_PASSWORD, TITAN_KEY_ALIAS);
      # otherwise one generated once on main and carried in the Actions cache,
      # so successive builds still install over each other.
      - name: Keystore from secrets
        if: env.HAS_KEYSTORE_SECRET == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TITAN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/titan.jks"
          {
            echo "TITAN_KEYSTORE=$RUNNER_TEMP/titan.jks"
            echo "TITAN_KEYSTORE_PASSWORD=${{ secrets.TITAN_KEYSTORE_PASSWORD }}"
            echo "TITAN_KEY_ALIAS=${{ secrets.TITAN_KEY_ALIAS }}"
          } >> "$GITHUB_ENV"
      - name: Restore cached keystore
        if: env.TITAN_KEYSTORE == ''
        id: keystore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-keystore
          key: titan-ci-keystore-v1
      - name: Generate keystore
        if: env.TITAN_KEYSTORE == '' && steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-keystore"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-keystore/titan.jks" -alias titan \
            -keyalg RSA -keysize 4096 -validity 36500 -storepass titan-ci -keypass titan-ci \
            -dname "CN=Titan"
      - name: Save keystore
        if: env.TITAN_KEYSTORE == '' && steps.keystore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-keystore
          key: titan-ci-keystore-v1
      - name: Use cached keystore
        if: env.TITAN_KEYSTORE == ''
        run: |
          {
            echo "TITAN_KEYSTORE=$RUNNER_TEMP/ci-keystore/titan.jks"
            echo "TITAN_KEYSTORE_PASSWORD=titan-ci"
            echo "TITAN_KEY_ALIAS=titan"
          } >> "$GITHUB_ENV"
      - run: ./gradlew ktlintCheck :core:test :app:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: titan-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: titan-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk titan.apk
          gh release create "android-1.0.${{ github.run_number }}" titan.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Titan for Android 1.0.${{ github.run_number }}" \
            --notes "Sideload titan.apk on the phone to install or update."
